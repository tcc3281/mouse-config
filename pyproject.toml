[project]
name = "mouse-config"
version = "0.1.0"
description = "Remap extra mouse buttons to keyboard shortcuts on Ubuntu/Wayland using uinput."
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
	"evdev>=1.9.0",
	"pyyaml>=6.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["mouse_map"]
